<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="color-scheme" content="light dark">
<title>Word Choice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
  /* Layout: one question per screen on a calm page; reading puts the passage beside the question on a wide iPad. */
  :root {
    --bg: #F3F5FA;
    --surface: #FFFFFF;
    --ink: #18213A;
    --muted: #55607E;
    --line: #D5DBE9;
    --accent: #0B7A75;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCF1EF;
    --challenge: #A85A00;
    --challenge-soft: #FCEBD3;
    --star: #B07A00;
    --star-soft: #FFF1C9;
    --good: #17703F;
    --good-soft: #DBF1E4;
    --bad: #B3261E;
    --bad-soft: #FBE2E0;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111729; --surface: #1A2238; --ink: #EAF0FF; --muted: #A6B2CE; --line: #2D3856;
      --accent: #4FCFC6; --accent-ink: #052321; --accent-soft: #163A3A;
      --challenge: #FFB561; --challenge-soft: #3A2910;
      --star: #FFD166; --star-soft: #3A3014;
      --good: #6FD99A; --good-soft: #143525; --bad: #FF8F86; --bad-soft: #3D1C1A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111729; --surface: #1A2238; --ink: #EAF0FF; --muted: #A6B2CE; --line: #2D3856;
    --accent: #4FCFC6; --accent-ink: #052321; --accent-soft: #163A3A;
    --challenge: #FFB561; --challenge-soft: #3A2910;
    --star: #FFD166; --star-soft: #3A3014;
    --good: #6FD99A; --good-soft: #143525; --bad: #FF8F86; --bad-soft: #3D1C1A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 20px; line-height: 1.55;
    padding-block: 20px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -0.01em; }
  h2 { font-size: 28px; font-weight: 800; }
  h3 { font-size: 21px; font-weight: 600; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .muted { color: var(--muted); }
  .small { font-size: 16px; }

  /* home */
  .home-head { display: grid; gap: 10px; margin-bottom: 28px; max-width: 46rem; }
  .rules { display: grid; gap: 8px; padding: 0; margin: 14px 0 0; list-style: none; }
  .rules li { display: flex; gap: 12px; align-items: baseline; }
  .rules b { font-family: var(--font-display); color: var(--accent); min-width: 1.4em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 26px; display: grid; gap: 14px; align-content: start; min-width: 0; }
  .card .meta { display: flex; gap: 10px 18px; flex-wrap: wrap; }
  .pill { display: inline-block; border-radius: 99px; padding: 2px 12px; font-size: 15px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .pill.ch { background: var(--challenge-soft); color: var(--challenge); }
  .pill.star { background: var(--star-soft); color: var(--star); }
  .btn { border: 0; border-radius: 14px; min-height: 56px; padding: 12px 26px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .btn.warn { background: var(--bad); color: #fff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* quiz */
  .top { display: grid; gap: 10px; margin-bottom: 18px; }
  .top-line { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar { height: 12px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s ease; }
  .stage { display: grid; gap: 18px; align-items: start; }
  .stage.read { grid-template-columns: 1fr; }
  @media (min-width: 900px) { .stage.read { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } .passage { position: sticky; top: 12px; max-height: calc(100vh - 40px); overflow: auto; } }
  .passage, .qbox { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; }
  .passage h3 { margin-bottom: 12px; }
  .passage p + p { margin-top: 14px; }
  .passage p { font-size: 20px; line-height: 1.65; max-width: 38rem; }
  .qhead { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .stem { font-size: 22px; font-weight: 700; margin-bottom: 18px; max-width: 40rem; }
  .stem u { text-decoration-thickness: 2px; }
  .opts { display: grid; gap: 12px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; min-height: 60px; }
  .opt .k { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
  .opt .t { padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .k { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .starbtn { display: inline-flex; gap: 8px; align-items: center; border: 2px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 16px; font-weight: 700; min-height: 44px; }
  .starbtn[aria-pressed="true"] { background: var(--star-soft); border-color: var(--star); color: var(--star); }
  .nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 22px; align-items: center; }
  .hint { color: var(--muted); font-size: 16px; }

  /* results */
  .score { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 14px; margin: 18px 0 26px; }
  .tile { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .tile b { display: block; font-family: var(--font-display); font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .skills { display: grid; gap: 12px; margin: 14px 0 28px; }
  .skill { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.5rem; gap: 12px; align-items: center; }
  @media (max-width: 640px) { .skill { grid-template-columns: 1fr 4rem; } .skill .bar { grid-column: 1 / -1; order: 3; } }
  .skill .n { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
  .bar.sk > i.low { background: var(--challenge); }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 16px; }
  .tab { border: 2px solid var(--line); background: transparent; border-radius: 99px; padding: 8px 20px; font-weight: 700; min-height: 48px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .rev { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 10px; margin-bottom: 14px; min-width: 0; }
  .rev.ok { border-left: 8px solid var(--good); }
  .rev.no { border-left: 8px solid var(--bad); }
  .rev .stem { font-size: 19px; margin: 0; }
  .ans { display: flex; gap: 8px; flex-wrap: wrap; font-size: 18px; }
  .ans span { padding: 2px 12px; border-radius: 10px; }
  .ans .you.no { background: var(--bad-soft); color: var(--bad); }
  .ans .you.ok, .ans .key { background: var(--good-soft); color: var(--good); }
  .why { font-size: 18px; color: var(--muted); }
  textarea.copybox { width: 100%; min-height: 220px; font: 16px/1.4 ui-monospace, Menlo, monospace; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>


<div class="wrap" id="app" aria-live="polite"></div>

<script id="bank">
/* ---------- QUESTION BANK ----------
   lvl "L" = Grade 4 level, "H" = challenge (Grade 5-6). a = index of the correct option (0-3). */
const LANG = [
 {id:"L1", lvl:"L", skill:"I or me", q:`Dad took my sister and ______ to the game.`, o:["me", "I", "myself", "mine"], a:0, why:`Take “my sister” out. “Dad took me to the game” sounds right. After an action word like took, use “me.”`},
 {id:"L2", lvl:"L", skill:"I or me", q:`______ and Maya finished the puzzle together.`, o:["Me", "Myself", "I", "Mine"], a:2, why:`Take Maya out. “I finished the puzzle” sounds right, so it is “I and Maya” — written “Maya and I.”`},
 {id:"L3", lvl:"L", skill:"Silent e", q:`She has been ______ her bike all afternoon.`, o:["ridding", "riding", "rideing", "riden"], a:1, why:`Ride ends in a silent e. The ending -ing starts with a vowel, so drop the e: riding. “Ridding” means getting rid of something.`},
 {id:"L4", lvl:"L", skill:"Silent e", q:`Please drive ______ on the icy road.`, o:["safly", "safelly", "safley", "safely"], a:3, why:`Safe ends in a silent e. The ending -ly starts with a consonant, so keep the e: safely.`},
 {id:"L5", lvl:"L", skill:"Look-alike words", q:`The cat hurt ______ paw.`, o:["it’s", "its’", "its", "it is"], a:2, why:`“Its” with no apostrophe shows ownership. “It’s” always means “it is” — “the cat hurt it is paw” does not work.`},
 {id:"L6", lvl:"L", skill:"Look-alike words", q:`______ coats are hanging by the door.`, o:["Their", "There", "They’re", "Theyre"], a:0, why:`“Their” shows the coats belong to them. “There” is a place. “They’re” means “they are.”`},
 {id:"L7", lvl:"L", skill:"Quotation marks and end marks", q:`Which sentence is punctuated correctly?`, o:[`“Watch out”! shouted Theo.`, `“Watch out!”, shouted Theo.`, `“Watch out”, shouted Theo!`, `“Watch out!” shouted Theo.`], a:3, why:`The exclamation mark belongs <em>inside</em> the quotation marks, and no comma is needed after it.`},
 {id:"L8", lvl:"L", skill:"Spelling", q:`He was too ______ to finish his homework.`, o:["tiered", "tired", "tird", "tirred"], a:1, why:`Tired keeps the e from tire. “Tiered” means arranged in layers, like a cake.`},
 {id:"H1", lvl:"H", skill:"I or me", q:`Between you and ______, this is the best one.`, o:["I", "me", "myself", "mine"], a:1, why:`After words like between, to, for and with, use “me.” It is always “between you and me.”`},
 {id:"H2", lvl:"H", skill:"Silent e", q:`The whole team felt ______ about the final.`, o:["hopful", "hoppeful", "hopefull", "hopeful"], a:3, why:`Hope ends in a silent e and -ful starts with a consonant, so keep the e: hopeful. One l at the end.`},
 {id:"H3", lvl:"H", skill:"Look-alike words", q:`Put the box ______, right next to ______ bag.`, o:["here / her", "her / here", "here / here", "her / her"], a:0, why:`“Here” is a place. “Her” shows who owns the bag.`},
 {id:"H4", lvl:"H", skill:"Quotation marks and end marks", q:`Which sentence is <strong>NOT</strong> punctuated correctly?`, o:[`“Stop!” yelled Ana.`, `Ben asked, “Where is it?”`, `“I’m ready”, said Mia.`, `“Let’s go,” said Dad.`], a:2, why:`The comma belongs inside the closing quotation marks: “I’m ready,” said Mia.`},
 {id:"H5", lvl:"H", skill:"Spelling", q:`Which word is spelled correctly?`, o:["recieve", "receeve", "reciave", "receive"], a:3, why:`i before e, except after c. The c comes first here, so it is receive.`},
 {id:"H6", lvl:"H", skill:"Word choice", q:`The storm was so loud it ______ the whole house.`, o:["shaked", "shook", "shooked", "shaking"], a:1, why:`Shake becomes shook in the past. “Shaked” is not a word.`},
 {id:"H7", lvl:"H", skill:"Look-alike words", q:`______ going to be late if we don’t leave now.`, o:["Were", "Where", "We’re", "Wear"], a:2, why:`“We’re” is short for “we are.” “Were” is the past of are, and “where” is a place.`},
 {id:"H8", lvl:"H", skill:"Spelling", q:`Which word is <strong>NOT</strong> spelled correctly?`, o:["seperate", "friend", "caught", "enough"], a:0, why:`It is separate. There is “a rat” in the middle: sep-<strong>a</strong>-rate.`},
];

const PASSAGES = [
];

<script>
(() => {
  "use strict";
  const KEY = "practice-words-v1";
  const NTFY = "https://ntfy.sh/mapprac-h3iomrkh7egfh0xr";
  let lastSend = "";
  const $app = document.getElementById("app");
  const LETTERS = ["A", "B", "C", "D"];

  /* Language: mix the two levels (L, H, L, H ...) so the harder ones are spread out. */
  function interleave(items) {
    const L = items.filter(x => x.lvl === "L"), H = items.filter(x => x.lvl === "H"), out = [];
    while (L.length || H.length) { if (L.length) out.push(L.shift()); if (H.length) out.push(H.shift()); }
    return out;
  }
  const SECTIONS = {
    lang: { name: "Word Choice", blurb: "Sixteen questions. Pick the word — you never have to spell it.", items: interleave(LANG) }
  };
  const PASS = Object.fromEntries(PASSAGES.map(p => [p.id, p]));

  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage may be blocked */ } };
  const fresh = () => ({ i: 0, ans: {}, star: {}, secs: 0, done: false });
  const get = k => (store[k] ||= fresh());
  const testMode = () => true; /* MAP-style only: no star, no Back, no difficulty labels */

  let view = "home", cur = null, tab = "missed", confirmReset = null, copyText = null;

  setInterval(() => {
    if (view === "quiz" && cur && !document.hidden) { get(cur).secs++; if (get(cur).secs % 5 === 0) save(); }
  }, 1000);

  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
  const mins = s => (s < 60 ? "under a minute" : Math.round(s / 60) + " min");

  function score(k) {
    const st = get(k), items = SECTIONS[k].items;
    const r = { right: 0, total: items.length, L: [0, 0], H: [0, 0], skills: {}, starRight: 0, starN: 0, missed: [] };
    items.forEach((it, n) => {
      const ok = st.ans[it.id] === it.a;
      if (ok) r.right++; else r.missed.push(n);
      r[it.lvl][1]++; if (ok) r[it.lvl][0]++;
      (r.skills[it.skill] ||= [0, 0])[1]++; if (ok) r.skills[it.skill][0]++;
      if (st.star[it.id]) { r.starN++; if (ok) r.starRight++; }
    });
    return r;
  }

  /* ---------- views ---------- */
  function home() {
    const card = k => {
      const s = SECTIONS[k], st = get(k), n = Object.keys(st.ans).length, tot = s.items.length;
      const ch = s.items.filter(x => x.lvl === "H").length;
      let action;
      if (st.done) action = `<button class="btn" data-act="results" data-k="${k}">See my results</button><button class="btn ghost" data-act="again" data-k="${k}">${confirmReset === k ? "Tap again to erase and restart" : "Start over"}</button>`;
      else if (n > 0) action = `<button class="btn" data-act="start" data-k="${k}">Keep going (${n} of ${tot} done)</button><button class="btn ghost" data-act="again" data-k="${k}">${confirmReset === k ? "Tap again to erase and restart" : "Start over"}</button>`;
      else action = `<button class="btn" data-act="start" data-k="${k}">Start</button>`;
      return `<section class="card"><h2>${s.name}</h2><p>${s.blurb}</p>
        <div class="meta"><span class="pill">${tot} questions</span><span class="pill ch">${ch} challenge</span><span class="pill">about 25 min</span></div>
        <div class="row">${action}</div></section>`;
    };
    $app.innerHTML = `
      <header class="home-head">
        <h1>Language and Reading Practice</h1>
        <p class="muted">Grade 4 practice with some harder questions mixed in. Do one part at a time. You can stop and come back.</p>
        <ul class="rules">
          <li><b>1</b><span>Answer <strong>every</strong> question, even if you are not sure. The real test does not let you skip.</span></li>
          ${testMode()
            ? `<li><b>2</b><span>You cannot go back to an earlier question, just like the real test. Take your time on each one.</span></li>
               <li><b>3</b><span>Some questions are harder on purpose. Missing some is normal.</span></li>`
            : `<li><b>2</b><span>If a question feels tricky, tap <strong>★ Not sure</strong> <em>and still pick your best answer.</em></span></li>
               <li><b>3</b><span>Questions marked <span class="pill ch">Challenge</span> are meant to be harder. Missing some is normal.</span></li>`}
          <li><b>4</b><span>Read each question twice. Watch for the words <strong>NOT</strong> and <strong>EXCEPT</strong>.</span></li>
        </ul>
      </header>
      <div class="cards">${card("lang")}</div>`;
  }

  function quiz() {
    const s = SECTIONS[cur], st = get(cur), it = s.items[st.i], tot = s.items.length;
    const isRead = cur === "read", p = isRead ? PASS[it.p] : null;
    const chosen = st.ans[it.id], starred = !!st.star[it.id];
    const passage = isRead ? `<article class="passage" aria-label="Passage"><div class="qhead"><h3>${p.title}</h3>${p.lvl === "H" && !testMode() ? '<span class="pill ch">Challenge passage</span>' : ""}</div>${p.text.map(t => `<p>${t}</p>`).join("")}</article>` : "";
    const lastQ = st.i === tot - 1;
    $app.innerHTML = `
      <div class="top">
        <div class="top-line"><strong>${s.name}</strong><span class="muted">Question ${st.i + 1} of ${tot}</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${st.i + 1}"><i style="width:${((st.i + 1) / tot) * 100}%"></i></div>
      </div>
      <div class="stage ${isRead ? "read" : ""}">
        ${passage}
        <section class="qbox">
          ${testMode() ? "" : `<div class="qhead">${it.lvl === "H" ? '<span class="pill ch">Challenge</span>' : ""}</div>`}
          <p class="stem">${it.q}</p>
          <div class="opts" role="group" aria-label="Answers">
            ${it.o.map((t, n) => `<button class="opt" data-act="pick" data-n="${n}" aria-pressed="${chosen === n}"><span class="k">${LETTERS[n]}</span><span class="t">${t}</span></button>`).join("")}
          </div>
          <div class="nav">
            <div class="row">
              ${testMode() ? "" : `<button class="btn ghost" data-act="back" ${st.i === 0 ? "disabled" : ""}>Back</button>
              <button class="starbtn" data-act="star" aria-pressed="${starred}">★ Not sure</button>`}
            </div>
            <div class="row">
              <span class="hint">${chosen === undefined ? "Pick an answer to go on." : ""}</span>
              <button class="btn" data-act="${lastQ ? "finish" : "next"}" ${chosen === undefined ? "disabled" : ""}>${lastQ ? "Finish" : "Next"}</button>
            </div>
          </div>
        </section>
      </div>
      <p class="hint" style="margin-top:18px"><button class="btn ghost" data-act="home" style="min-height:44px;padding:6px 18px">Save and go back</button></p>`;
    window.scrollTo(0, 0);
  }

  function results() {
    const s = SECTIONS[cur], st = get(cur), r = score(cur);
    const sk = Object.entries(r.skills).sort((a, b) => pct(a[1][0], a[1][1]) - pct(b[1][0], b[1][1]));
    const rev = (tab === "missed" ? r.missed : s.items.map((_, n) => n));
    const letter = n => (n === undefined ? "no answer" : LETTERS[n]);
    $app.innerHTML = `
      <p><button class="btn ghost" data-act="home" style="min-height:44px;padding:6px 18px">Back to start</button></p>
      <h1 style="margin-top:18px">${s.name}: your results</h1>
      <div class="score">
        <div class="tile"><span class="muted small">All questions</span><b>${r.right} / ${r.total}</b><span class="muted small">${pct(r.right, r.total)}%</span></div>
        <div class="tile"><span class="muted small">Grade 4 level</span><b>${r.L[0]} / ${r.L[1]}</b><span class="muted small">${pct(r.L[0], r.L[1])}%</span></div>
        <div class="tile"><span class="muted small">Challenge questions</span><b>${r.H[0]} / ${r.H[1]}</b><span class="muted small">${pct(r.H[0], r.H[1])}%</span></div>
        ${r.starN ? `<div class="tile"><span class="muted small">Marked ★ Not sure</span><b>${r.starN}</b><span class="muted small">${r.starRight} of them were right</span></div>` : ""}
      </div>
      <p class="muted">Time: ${mins(st.secs)}. Challenge questions are meant to be harder, so a lower score there is expected.</p>
      <h2 style="margin-top:26px">By skill</h2>
      <div class="skills">${sk.map(([n, v]) => `<div class="skill"><span>${esc(n)}</span><div class="bar sk"><i class="${pct(v[0], v[1]) < 60 ? "low" : ""}" style="width:${pct(v[0], v[1])}%"></i></div><span class="n">${v[0]} / ${v[1]}</span></div>`).join("")}</div>
      <div class="row"><button class="btn" data-act="send">Send results to Dad</button><button class="btn ghost" data-act="mail">Email instead</button><button class="btn ghost" data-act="copy">Copy results</button></div><p class="hint" style="margin-top:10px">${st.sentAt ? "Sent to Dad." : (lastSend === "fail" ? "It did not send. Tap Email instead." : "Tap Send results to Dad.")}</p>
      ${copyText ? `<p class="hint" style="margin:12px 0 6px">Select all of this text and copy it:</p><textarea class="copybox" id="copybox" readonly>${esc(copyText)}</textarea>` : ""}
      <h2 style="margin-top:30px">Look at the answers</h2>
      <div class="tabs"><button class="tab" data-act="tab" data-t="missed" aria-pressed="${tab === "missed"}">Missed (${r.missed.length})</button><button class="tab" data-act="tab" data-t="all" aria-pressed="${tab === "all"}">All ${r.total}</button></div>
      ${rev.length === 0 ? `<p>You got every question right.</p>` : rev.map(n => {
        const it = s.items[n], mine = st.ans[it.id], ok = mine === it.a, p = cur === "read" ? PASS[it.p] : null;
        return `<article class="rev ${ok ? "ok" : "no"}">
          <div class="qhead" style="margin:0"><strong>${n + 1}.</strong><span class="pill">${esc(it.skill)}</span>${it.lvl === "H" ? '<span class="pill ch">Challenge</span>' : ""}${st.star[it.id] ? '<span class="pill star">★ Not sure</span>' : ""}${p ? `<span class="muted small">${esc(p.title)}</span>` : ""}</div>
          <p class="stem">${it.q}</p>
          <div class="ans"><span class="you ${ok ? "ok" : "no"}">You: ${letter(mine)}${mine !== undefined ? ". " + it.o[mine] : ""}</span>${ok ? "" : `<span class="key">Right answer: ${LETTERS[it.a]}. ${it.o[it.a]}</span>`}</div>
          <p class="why">${it.why}</p></article>`;
      }).join("")}`;
    window.scrollTo(0, 0);
  }

  function summaryText(k) {
    const s = SECTIONS[k], st = get(k), r = score(k);
    const lines = [`${s.name} practice, ${(() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })()}`, `Score ${r.right}/${r.total} (${pct(r.right, r.total)}%). Grade 4 level ${r.L[0]}/${r.L[1]}. Challenge ${r.H[0]}/${r.H[1]}. Time ${mins(st.secs)}.`, `Marked Not sure: ${r.starN} (${r.starRight} right).`, "By skill:"];
    Object.entries(r.skills).forEach(([n, v]) => lines.push(`- ${n}: ${v[0]}/${v[1]}`));
    lines.push("Answers (question: her answer, key, * = Not sure, ! = missed):");
    s.items.forEach((it, n) => { const m = st.ans[it.id]; lines.push(`${n + 1} ${it.id}${it.lvl === "H" ? "(C)" : ""}: ${m === undefined ? "-" : LETTERS[m]} / ${LETTERS[it.a]}${st.star[it.id] ? " *" : ""}${m === it.a ? "" : " !"}`); });
    return lines.join("\n");
  }

  async function pushResults(k) {
    const st = get(k);
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch(NTFY, { method: "POST", body: summaryText(k), headers: { "Title": "Practice results: " + SECTIONS[k].name, "Tags": "memo" }, signal: ctl.signal });
      clearTimeout(to);
      if (!r.ok) throw new Error("status " + r.status);
      st.sentAt = Date.now(); lastSend = "ok"; save(); return true;
    } catch (e) { lastSend = "fail"; return false; }
  }

  /* ---------- events ---------- */
  $app.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const act = b.dataset.act, k = b.dataset.k || cur;
    if (act === "start") { cur = k; view = "quiz"; confirmReset = null; quiz(); return; }
    if (act === "results") { cur = k; view = "results"; tab = "missed"; copyText = null; results(); return; }
    if (act === "again") {
      if (confirmReset === k) { store[k] = fresh(); save(); confirmReset = null; } else { confirmReset = k; }
      home(); return;
    }
    if (act === "home") { save(); view = "home"; copyText = null; confirmReset = null; home(); window.scrollTo(0, 0); return; }
    if (act === "tab") { tab = b.dataset.t; results(); return; }
    if (act === "send") { pushResults(cur).then(() => { if (view === "results") results(); }); return; }
    if (act === "mail") {
      const a = document.createElement("a");
      a.href = "mailto:?subject=" + encodeURIComponent("Practice results") + "&body=" + encodeURIComponent(summaryText(cur));
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    if (act === "copy") {
      const t = summaryText(cur);
      const show = () => { copyText = t; results(); const box = document.getElementById("copybox"); if (box) { box.focus(); box.select(); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => { copyText = t + "\n\n(Copied to the clipboard.)"; results(); }, show); else show();
      return;
    }
    if (view !== "quiz") return;
    const st = get(cur), it = SECTIONS[cur].items[st.i];
    if (act === "pick") { st.ans[it.id] = Number(b.dataset.n); save(); quiz(); }
    else if (act === "star") { st.star[it.id] = !st.star[it.id]; save(); quiz(); }
    else if (act === "next") { st.i++; save(); quiz(); }
    else if (act === "back") { st.i = Math.max(0, st.i - 1); save(); quiz(); }
    else if (act === "finish") { st.done = true; delete st.sentAt; save(); view = "results"; tab = "missed"; copyText = null; results(); pushResults(cur).then(() => { if (view === "results") results(); }); }
  });

  home();
})();
</script>

</body></html>
